server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API: forward /api to the backend service (scale it independently behind this).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 510m;   # uploads; per-type limits are set in Administration → System settings (max 500 MB)
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # ES modules (the PDF.js worker) must be served as JavaScript; stock mime.types maps .mjs to octet-stream.
    location ~ \.mjs$ {
        types { }
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: unknown paths serve the SPA.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
