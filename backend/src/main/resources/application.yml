spring:
  application:
    name: smart-library-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartlibrary}
    username: ${DB_USERNAME:smartlibrary}
    password: ${DB_PASSWORD:smartlibrary}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:500MB}
      max-request-size: ${MAX_UPLOAD_SIZE:500MB}
  threads:
    virtual:
      enabled: true
  jackson:
    deserialization:
      # Treat omitted booleans/ints in request bodies as false/0 instead of rejecting them.
      fail-on-null-for-primitives: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    # HMAC-SHA256 secret, at least 32 bytes. ALWAYS override in production via JWT_SECRET.
    secret: ${JWT_SECRET}
    issuer: zscmst-smart-library
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
    kiosk-token-ttl: ${JWT_KIOSK_TTL:365d}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  bootstrap-admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
    # The first administrator must choose a new password at first sign-in.
    must-change: true
  library:
    timezone: ${LIBRARY_TIMEZONE:Asia/Manila}
  storage:
    # Where uploaded e-book files are kept (outside the web root; served only through the API).
    dir: ${STORAGE_DIR:./data/files}
  isbn-lookup:
    base-url: https://openlibrary.org
