# ZSCMST Smart Library - full stack.
#   docker compose up -d --build
# Frontend: http://localhost:8081   API: http://localhost:8080/api
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartlibrary
      POSTGRES_USER: smartlibrary
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smartlibrary}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartlibrary -d smartlibrary"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/smartlibrary
      DB_USERNAME: smartlibrary
      DB_PASSWORD: ${DB_PASSWORD:-smartlibrary}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      STORAGE_DIR: /data/files
    volumes:
      - files:/data/files          # uploaded e-books (back this up together with the database)
    ports:
      - "8080:8080"

  web:
    # Context is the repo root so the build can read the shared feather/ icon folder.
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8081:80"

volumes:
  pgdata:
  files:
