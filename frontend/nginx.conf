server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Live updates for kiosks (WebSocket). Must come before /api/ so the upgrade headers are passed.
    location /api/ws {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
    }

    # Same-origin API: forward /api to the backend service (scale it independently behind this).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        # nginx is the edge here: send the real peer address, not a client-supplied X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 510m;   # uploads; per-type limits are set in Administration → System settings (max 500 MB)
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # ES modules (the PDF.js worker) must be served as JavaScript; stock mime.types maps .mjs to octet-stream.
    location ~ \.mjs$ {
        types { }
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: unknown paths serve the SPA.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
