name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Java 25 + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: smartlibrary_test
          POSTGRES_USER: smartlibrary
          POSTGRES_PASSWORD: smartlibrary
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smartlibrary" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/smartlibrary_test
      TEST_DB_USERNAME: smartlibrary
      TEST_DB_PASSWORD: smartlibrary
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Unit and integration tests
        run: mvn -B -ntp verify
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports

  frontend:
    name: Frontend type-check, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint src
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build api and web images
        env:
          JWT_SECRET: ci-only-placeholder-secret-not-used-at-runtime
          DB_PASSWORD: ci-only-not-used-at-runtime
        run: docker compose build api web
