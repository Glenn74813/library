# ZSCMST Smart Library - full stack.
#   docker compose up -d --build
# Frontend: http://localhost:8081   API: http://localhost:8080/api
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartlibrary
      POSTGRES_USER: smartlibrary
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      # This PC only (backups, restore test, integration tests); never the network.
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartlibrary -d smartlibrary"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/smartlibrary
      DB_USERNAME: smartlibrary
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
      # First start only: the first administrator's password (leave empty to have one generated and logged once).
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      STORAGE_DIR: /data/files
    volumes:
      - files:/data/files          # uploaded e-books (back this up together with the database)
    ports:
      # This PC only: the web container and the Cloudflare tunnel reach the API from here.
      - "127.0.0.1:8080:8080"
      # SIP2 for self-check stations. Not encrypted: this PC only unless SIP_BIND is set to the library-LAN
      # address of this PC (never a public one).
      - "${SIP_BIND:-127.0.0.1}:6001:6001"

  # Daily database + uploaded-files backups into ./backups (copy that folder off the server too).
  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"   # files in ./backups belong to this host user
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: smartlibrary
      PGDATABASE: smartlibrary
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: ${LIBRARY_TIMEZONE:-Asia/Manila}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - files:/data/files
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh", "loop"]

  web:
    # Context is the repo root so the build can read the shared feather/ icon folder.
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8081:80"

  # Optional HTTPS (required for real deployments; also enables the microphone on the Security gate page).
  #   docker compose --profile https up -d
  https:
    image: caddy:2.10-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - web
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      TLS: ${TLS:-internal}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  pgdata:
  files:
  caddy-data:
